---
# Service для PostgreSQL (внутренний)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: warden
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: master
  - port: 5433
    targetPort: 5433
    name: slave

---
# Service для PostgreSQL Master (для отдельного подключения)
apiVersion: v1
kind: Service
metadata:
  name: postgres-master
  namespace: warden
  labels:
    app: postgres
    role: master
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: master

---
# Service для PostgreSQL Slave (для отдельного подключения)
apiVersion: v1
kind: Service
metadata:
  name: postgres-slave
  namespace: warden
  labels:
    app: postgres
    role: slave
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5433
    name: slave
