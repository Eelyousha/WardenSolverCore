---
# Horizontal Pod Autoscaler для автоматического масштабирования
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: warden-api-hpa
  namespace: warden
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: warden-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# NetworkPolicy для ограничения трафика
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-network-policy
  namespace: warden
spec:
  podSelector:
    matchLabels:
      app: warden-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5433
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# PodDisruptionBudget для обеспечения доступности при обновлениях
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: warden-api-pdb
  namespace: warden
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: warden-api
